name = "zalo-baas-agent"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "dev"
KEK_V1 = "mock_kek_v1_base64_for_dev_32b_AAAAAAAAAAAAAAAAAAAAAAAAAAA="
GEMINI_API_KEY = "mock_gemini_api_key_for_dev"

[[d1_databases]]
binding = "DB"
database_name = "zalo-baas-db"
database_id = "mock-d1-db-id"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "mock-kv-cache-id"

[[vectorize]]
binding = "VECTORS"
index_name = "zalo-baas-vectors"

[[queues.consumers]]
queue = "q_inbound"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "q_inbound_dlq"
